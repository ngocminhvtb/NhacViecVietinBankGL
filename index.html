<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ nhắc việc – VietinBank CN Gia Lai</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e6ed;--pr:#0b5cab;--pr2:#e6f0fb;--red:#c62828;--red2:#fdeaea;--org:#b45309;--org2:#fff3e0;--grn:#2e7d32;--grn2:#e8f5e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18222e;--tx:#e8edf3;--mu:#93a0b0;--bd:#2a3644;--pr:#5aa9f0;--pr2:#16324d;--red:#ff7b72;--red2:#3a1b1d;--org:#f0a44b;--org2:#3a2a14;--grn:#6fcf76;--grn2:#17301b}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18222e;--tx:#e8edf3;--mu:#93a0b0;--bd:#2a3644;--pr:#5aa9f0;--pr2:#16324d;--red:#ff7b72;--red2:#3a1b1d;--org:#f0a44b;--org2:#3a2a14;--grn:#6fcf76;--grn2:#17301b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}.sub{color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.sm{padding:5px 9px;font-size:12.5px;border-radius:8px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.st b{display:block;font-size:24px}.st span{font-size:12px;color:var(--mu)}
.st.r b{color:var(--red)}.st.o b{color:var(--org)}.st.p b{color:var(--pr)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tab.on{background:var(--pr);border-color:var(--pr);color:#fff}
.gh{margin:16px 2px 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;display:flex;gap:6px;align-items:center}
.gh.red{color:var(--red)}.gh.org{color:var(--org)}.gh.pr{color:var(--pr)}.gh.mu{color:var(--mu)}
.it{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pr);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.it.red{border-left-color:var(--red)}.it.org{border-left-color:var(--org)}.it.done{opacity:.6}
.r1{display:flex;gap:10px;align-items:flex-start}
.r1 input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.tt{font-weight:600;word-break:break-word}.done .tt{text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12.5px;color:var(--mu)}
.tag{background:var(--pr2);color:var(--pr);border-radius:6px;padding:1px 7px;font-weight:600}
.due{border-radius:6px;padding:1px 7px;font-weight:600;background:var(--pr2);color:var(--pr)}
.due.red{background:var(--red2);color:var(--red)}.due.org{background:var(--org2);color:var(--org)}.due.grn{background:var(--grn2);color:var(--grn)}
.note{margin:5px 0 0 32px;font-size:13px;color:var(--mu);white-space:pre-wrap;word-break:break-word}
.act{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 32px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;display:none}
.panel.on{display:block}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .f{display:flex;flex-direction:column;gap:3px}.fg .full{grid-column:1/-1}
label{font-size:12.5px;color:var(--mu);font-weight:600}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
.empty{text-align:center;color:var(--mu);padding:30px 10px;background:var(--card);border:1px dashed var(--bd);border-radius:12px}
.foot{margin:22px 0 8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media(max-width:520px){.fg{grid-template-columns:1fr}.stats{gap:6px}.st b{font-size:21px}}

<body>
<div class="w">
  <div class="top">
    <div><div class="brand">VietinBank · Chi nhánh Gia Lai</div><h1>Sổ nhắc việc</h1><div class="sub" id="today"></div><div class="sub" id="sync">💾 Lưu trên máy này</div></div>
    <button class="btn" id="add">+ Thêm việc</button>
  </div>
  <div class="sheet">

  <div class="panel" id="form">
    <div class="fg">
      <div class="f full"><label>Nội dung *</label><input type="text" id="fTitle" placeholder="Báo cáo tăng trưởng - Phòng KHDN VVN"></div>
      <div class="f"><label>Loại</label>
        <select id="fType">
          <option value="giao">Đã giao – chờ báo cáo</option>
          <option value="hop">Lịch họp</option>
          <option value="ct">Lịch công tác</option>
          <option value="dl">Đang làm</option>
          <option value="dd">Dự định làm</option>
        </select></div>
      <div class="f"><label>Phòng / người phụ trách</label><input type="text" id="fUnit" placeholder="Phòng KHDN VVN"></div>
      <div class="f"><label>Ngày (hạn / diễn ra)</label><input type="date" id="fDate"></div>
      <div class="f"><label>Giờ (nếu có)</label><input type="time" id="fTime"></div>
      <div class="f"><label>Lặp lại</label>
        <select id="fRep"><option value="">Không lặp</option><option value="d">Hằng ngày</option><option value="w">Hằng tuần</option><option value="m">Hằng tháng</option></select></div>
      <div class="f"><label>Nhắc trước (ngày)</label>
        <select id="fLead"><option value="0">Đúng ngày</option><option value="1">Trước 1 ngày</option><option value="2">Trước 2 ngày</option><option value="3">Trước 3 ngày</option><option value="7">Trước 7 ngày</option></select></div>
      <div class="f full"><label>Ghi chú / yêu cầu</label><textarea id="fNote" placeholder="Nội dung cần nắm, địa điểm, thành phần..."></textarea></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="save">Lưu</button><button class="btn g" id="cancel">Đóng</button></div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>

  <div class="foot">
    <button class="btn g sm" id="showDone">Hiện việc đã xong</button>
    <button class="btn g sm" id="bk">Sao lưu / khôi phục</button>
  </div>
  <div class="panel" id="bkp">
    <div class="sub" style="margin-bottom:6px">Dữ liệu lưu ngay trên trình duyệt của máy này. Hãy sao chép đoạn dưới đây cất vào Zalo/Email để sao lưu; dán lại và bấm Khôi phục khi đổi máy.</div>
    <textarea id="bkt" style="min-height:110px" spellcheck="false"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" id="cp">Sao chép</button><button class="btn g sm" id="rs">Khôi phục từ nội dung dán</button></div>
  </div>
  </div>
</div>

<script>
(function(){
var KEY='nhacviec_giamdoc_v1',items=[],editId=null,filter='all',showDone=false;
var TYPES={giao:'Chờ báo cáo',hop:'Họp',ct:'Công tác',dl:'Đang làm',dd:'Dự định'};
var ICON={giao:'📨',hop:'👥',ct:'🚗',dl:'🔧',dd:'💡'};
var TABS=[['all','Tất cả'],['giao','Chờ báo cáo'],['hop','Họp'],['ct','Công tác'],['dl','Đang làm'],['dd','Dự định']];
var $=function(id){return document.getElementById(id)};
function load(){try{var s=localStorage.getItem(KEY);items=s?JSON.parse(s):[]}catch(e){items=[]}if(!Array.isArray(items))items=[]}
var doc=null,writing=false,dirty=false;
function setSync(t){$('sync').textContent=t}
function push(){
  if(!doc)return;
  if(writing){dirty=true;return}
  writing=true;
  doc.set({items:JSON.parse(JSON.stringify(items)),v:Date.now()}).then(function(){setSync('☁️ Đã đồng bộ')}).catch(function(){setSync('⚠️ Chưa đồng bộ được – dữ liệu vẫn lưu trên máy này')}).then(function(){writing=false;if(dirty){dirty=false;push()}});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}push()}
function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    window.claude.use('db').then(function(db){
      if(!db)return;
      doc=db.doc('sonhacviec/data');
      setSync('☁️ Đang đồng bộ...');
      doc.onSnapshot(function(s){
        if(s.metadata&&s.metadata.hasPendingWrites)return;
        if(s.exists){
          var d=s.data();
          if(d&&Array.isArray(d.items)){
            items=JSON.parse(JSON.stringify(d.items));
            try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}
            render();
          }
          setSync('☁️ Đã đồng bộ');
        }else if(!(s.metadata&&s.metadata.fromCache)){
          if(items.length)push();else setSync('☁️ Đã kết nối đồng bộ');
        }
      },function(){setSync('💾 Lưu trên máy này (chưa đồng bộ)');doc=null});
    }).catch(function(){});
  }catch(e){}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function todayD(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function diff(s){return Math.round((parse(s)-todayD())/864e5)}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function addMonth(s){var d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)}
var WD=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
function fmt(s){var d=parse(s);return WD[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?'/'+d.getFullYear():'')}
function nextDate(it){return it.rep==='d'?addDays(it.date,1):it.rep==='w'?addDays(it.date,7):it.rep==='m'?addMonth(it.date):it.date}

// nhóm hiển thị: cần chú ý = quá hạn, hôm nay, ngày mai, hoặc đã tới ngày nhắc trước
function group(it){
  if(!it.date)return 'none';
  var d=diff(it.date);
  if(d<0)return 'over';
  if(d===0)return 'today';
  if(d===1)return 'tom';
  if(d<=7)return 'week';
  return 'later';
}
function isAlert(it){if(it.done||!it.date)return false;var d=diff(it.date);return d<=Math.max(1,+it.lead||0)}

function render(){
  var t=todayD();
  $('today').textContent='Hôm nay: '+WD[t.getDay()]+', ngày '+t.getDate()+'/'+(t.getMonth()+1)+'/'+t.getFullYear();
  var open=items.filter(function(i){return !i.done});
  var cnt={over:0,today:0,tom:0,week:0};
  open.forEach(function(i){var g=group(i);if(cnt[g]!==undefined)cnt[g]++});
  $('stats').innerHTML=
    '<div class="st r" data-g="over"><b>'+cnt.over+'</b><span>Quá hạn</span></div>'+
    '<div class="st o" data-g="today"><b>'+cnt.today+'</b><span>Hôm nay</span></div>'+
    '<div class="st o" data-g="tom"><b>'+cnt.tom+'</b><span>Ngày mai</span></div>'+
    '<div class="st p" data-g="week"><b>'+cnt.week+'</b><span>7 ngày tới</span></div>';
  $('tabs').innerHTML=TABS.map(function(x){return '<button class="tab'+(filter===x[0]?' on':'')+'" data-f="'+x[0]+'">'+x[1]+'</button>'}).join('');

  var pool=items.filter(function(i){return filter==='all'||i.type===filter});
  var out='';
  // Khối "Cần nhớ sáng nay"
  if(filter==='all'){
    var al=pool.filter(isAlert).sort(cmp);
    out+='<div class="gh red">🔔 Cần chú ý sáng nay ('+al.length+')</div>';
    out+=al.length?al.map(card).join(''):'<div class="empty">Không có việc nào đến hạn hôm nay hoặc ngày mai. 👍</div>';
  }
  var defs=[['over','⚠️ Quá hạn','red'],['today','Hôm nay','org'],['tom','Ngày mai','org'],['week','Trong 7 ngày tới','pr'],['later','Sau đó','mu'],['none','Chưa có ngày','mu']];
  var alertIds={};if(filter==='all')pool.filter(isAlert).forEach(function(i){alertIds[i.id]=1});
  defs.forEach(function(g){
    if(filter==='all'&&(g[0]==='over'||g[0]==='today'||g[0]==='tom')&&false)return;
    var l=pool.filter(function(i){return !i.done&&group(i)===g[0]&&!alertIds[i.id]}).sort(cmp);
    if(l.length)out+='<div class="gh '+g[2]+'">'+g[1]+' ('+l.length+')</div>'+l.map(card).join('');
  });
  if(!pool.some(function(i){return !i.done})&&filter!=='all')out+='<div class="empty">Chưa có mục nào. Bấm “+ Thêm việc”.</div>';
  if(filter==='all'&&!items.length)out+='<div class="empty" style="margin-top:12px">Chưa có dữ liệu. Bấm “+ Thêm việc” để ghi công việc đã giao các phòng, lịch họp, lịch công tác...</div>';
  if(showDone){var dn=pool.filter(function(i){return i.done}).sort(function(a,b){return (b.doneAt||'').localeCompare(a.doneAt||'')}).slice(0,40);
    out+='<div class="gh mu">✅ Đã xong gần đây ('+dn.length+')</div>'+(dn.length?dn.map(card).join(''):'<div class="empty">Chưa có.</div>');}
  $('showDone').textContent=showDone?'Ẩn việc đã xong':'Hiện việc đã xong';
  $('list').innerHTML=out;
}
function cmp(a,b){return ((a.date||'9999')+(a.time||'99:99')).localeCompare((b.date||'9999')+(b.time||'99:99'))}
function dueBadge(it){
  if(!it.date)return '';
  var d=diff(it.date),c='',tx;
  if(it.done){c='grn';tx=fmt(it.date)}
  else if(d<0){c='red';tx='Quá hạn '+(-d)+' ngày · '+fmt(it.date)}
  else if(d===0){c='org';tx='Hôm nay'}
  else if(d===1){c='org';tx='Ngày mai · '+fmt(it.date)}
  else tx='Còn '+d+' ngày · '+fmt(it.date);
  return '<span class="due '+c+'">'+tx+(it.time?' · '+esc(it.time):'')+'</span>';
}
function card(it){
  var g=it.date&&!it.done?diff(it.date):9,cl=it.done?'done':g<0?'red':g<=1?'org':'';
  var rep=it.rep?'<span>🔁 '+({d:'hằng ngày',w:'hằng tuần',m:'hằng tháng'}[it.rep])+'</span>':'';
  return '<div class="it '+cl+'" data-id="'+it.id+'"><div class="r1"><input type="checkbox" data-a="done"'+(it.done?' checked':'')+' aria-label="Hoàn thành">'+
    '<div style="flex:1;min-width:0"><div class="tt">'+ICON[it.type]+' '+esc(it.title)+'</div>'+
    '<div class="meta"><span class="tag">'+TYPES[it.type]+'</span>'+(it.unit?'<span>👤 '+esc(it.unit)+'</span>':'')+dueBadge(it)+rep+'</div></div></div>'+
    (it.note?'<div class="note">'+esc(it.note)+'</div>':'')+
    '<div class="act">'+(it.done?'<button class="btn g sm" data-a="undo">Mở lại</button>':
      '<button class="btn g sm" data-a="p1">Lùi 1 ngày</button><button class="btn g sm" data-a="p7">Lùi 1 tuần</button>')+
    '<button class="btn g sm" data-a="edit">Sửa</button><button class="btn g sm" data-a="del">Xoá</button></div></div>';
}

function openForm(it){
  editId=it?it.id:null;
  $('fTitle').value=it?it.title:'';$('fType').value=it?it.type:(filter==='all'?'giao':filter);
  $('fUnit').value=it?it.unit||'':'';$('fDate').value=it?it.date||'':ymd(todayD());
  $('fTime').value=it?it.time||'':'';$('fRep').value=it?it.rep||'':'';$('fLead').value=it?String(it.lead||0):'1';
  $('fNote').value=it?it.note||'':'';
  $('form').classList.add('on');$('fTitle').focus();$('form').scrollIntoView({behavior:'smooth',block:'start'});
}
function closeForm(){$('form').classList.remove('on');editId=null}
$('add').onclick=function(){openForm(null)};
$('cancel').onclick=closeForm;
$('save').onclick=function(){
  var title=$('fTitle').value.trim();if(!title){$('fTitle').focus();return}
  var o={title:title,type:$('fType').value,unit:$('fUnit').value.trim(),date:$('fDate').value,time:$('fTime').value,rep:$('fRep').value,lead:+$('fLead').value,note:$('fNote').value.trim()};
  if(editId){items.forEach(function(i){if(i.id===editId)Object.assign(i,o)})}
  else{o.id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);o.done=false;items.push(o)}
  save();closeForm();render();
};
$('list').addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var box=el.closest('.it'),id=box.getAttribute('data-id'),it=items.filter(function(i){return i.id===id})[0];if(!it)return;
  var a=el.getAttribute('data-a');
  if(a==='done'){
    if(el.checked){it.done=true;it.doneAt=ymd(todayD())+' '+new Date().toTimeString().slice(0,5);
      if(it.rep&&it.date){var n=JSON.parse(JSON.stringify(it));n.id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);n.date=nextDate(it);n.done=false;delete n.doneAt;items.push(n)}}
    else{it.done=false}
  }
  else if(a==='undo'){it.done=false}
  else if(a==='p1'){it.date=addDays(it.date||ymd(todayD()),1)}
  else if(a==='p7'){it.date=addDays(it.date||ymd(todayD()),7)}
  else if(a==='edit'){openForm(it);return}
  else if(a==='del'){if(!confirm('Xoá mục này?'))return;items=items.filter(function(i){return i.id!==id})}
  save();render();
});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(b){filter=b.getAttribute('data-f');render()}});
$('stats').addEventListener('click',function(e){var b=e.target.closest('[data-g]');if(b){filter='all';render();var hs=document.querySelectorAll('.gh');for(var i=0;i<hs.length;i++){if(hs[i].textContent.indexOf({over:'Quá hạn',today:'Hôm nay',tom:'Ngày mai',week:'7 ngày'}[b.getAttribute('data-g')])>-1){hs[i].scrollIntoView({behavior:'smooth',block:'start'});break}}}});
$('showDone').onclick=function(){showDone=!showDone;render()};
$('bk').onclick=function(){var p=$('bkp');p.classList.toggle('on');if(p.classList.contains('on'))$('bkt').value=JSON.stringify(items)};
$('cp').onclick=function(){var t=$('bkt');t.value=JSON.stringify(items);t.select();try{document.execCommand('copy');$('cp').textContent='Đã sao chép ✓'}catch(e){}};
$('rs').onclick=function(){
  try{var d=JSON.parse($('bkt').value);if(!Array.isArray(d))throw 0;
    if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng nội dung đã dán ('+d.length+' mục)?'))return;
    items=d;save();render();$('bkp').classList.remove('on')}
  catch(e){alert('Nội dung dán không hợp lệ.')}
};
load();render();initSync();
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
})();
</script>
</body>
